<div class="home-page">
  <!-- Carousel en haut — affiche les lives -->
  <section class="section">
    <app-featured-carousel [streams]="liveStreams" [isLoading]="isLoadingLiveStreams"></app-featured-carousel>
  </section>

  <section class="section">
    <div class="section-header">
      <h2>Catégories populaires</h2>
    </div>
    
    <div *ngIf="isLoadingCategories" class="loading-state">
      Chargement des catégories...
    </div>
    
    <div *ngIf="!isLoadingCategories" class="categories-grid">
      <app-category-card 
        *ngFor="let category of popularCategories" 
        [category]="category">
      </app-category-card>
    </div>
  </section>
</div>
